# Smartmi Standing Fan 2 / zhimi.fan.za3
#
# This is flashed onto the device's own Xiaomi ESP32 WiFi module, which then
# talks to the fan's MCU over UART. Put your own credentials into secrets.yaml
# (see secrets.yaml.example).
#
# The UART pins below are the ones used on the zhimi.fan.za3 module. Verify
# them for your own device before flashing.
#
# Protocol in short - strings are quoted, numbers are not:
#   ESP -> MCU:  down set_power "on"          MCU -> ESP:  result "ok"
#   ESP -> MCU:  down get_prop "power","mode" MCU -> ESP:  result "on","natural"
#   MCU -> ESP:  props power "on" fan_level 1 ...   (pushed on change)

external_components:
  - source:
      type: local
      path: components

esphome:
  name: smartmi-fan-2
  friendly_name: Smartmi Fan 2
  comment: Smartmi Standing Fan 2 (zhimi.fan.za3), legacy miio UART

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y
    advanced:
      # Xiaomi's ESP32 modules carry no valid eFuse MAC CRC
      ignore_efuse_custom_mac: true
      ignore_efuse_mac_crc: true

api:
  encryption:
    key: !secret api_encryption_key
  # do not reboot when Home Assistant is unreachable - the fan stays usable
  reboot_timeout: 0s
  services:
    # send a raw command to the MCU, e.g. 'set_angle 120'
    - service: mcu_command
      variables:
        command: string
      then:
        - lambda: 'id(fan_hub).queue_command(command);'
    # poll all configured properties right now
    - service: refresh
      then:
        - lambda: 'id(fan_hub).request_refresh();'

ota:
  - platform: esphome
    password: !secret ota_password

# after 5 boots without 1 minute of uptime the ESP comes up in a WiFi+OTA only
# mode instead of becoming a soldering job
safe_mode:
  num_attempts: 5
  boot_is_good_after: 1min
  reboot_timeout: 15min

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

  # Without a reachable network the ESP brings up its own access point after
  # 60s, so the fan stays controllable from a phone at http://192.168.4.1/.
  # Configuring an AP also disables ESPHome's WiFi reboot timer, which keeps
  # the node stable while offline.
  ap:
    ssid: "Smartmi Fan Fallback Hotspot"
    password: !secret ap_password
    ap_timeout: 60s

captive_portal:

web_server:
  port: 80
  auth:
    username: admin
    password: !secret web_password

logger:
  level: DEBUG
  # Important: the MCU owns UART0, logging to it corrupts the protocol
  baud_rate: 0

# The MCU asks for the wall clock time (used by its off timer). Optional.
time:
  - platform: homeassistant
    id: ha_time

uart:
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 115200

globals:
  - id: last_angle_press
    type: uint32_t
    restore_value: false
    initial_value: "0"

zhimi_miio:
  id: fan_hub

  # get_prop reads any number of properties back at once. This is what gives
  # angle, child_lock, buzzer, led_b and poweroff_time real state - the MCU
  # never reports those on its own.
  poll_interval: 10s
  poll_properties:
    - power
    - mode
    - fan_level
    - speed_level
    - natural_level
    - angle
    - angle_enable
    - child_lock
    - buzzer
    - led_b
    - poweroff_time
    - speed
    - use_time

  # The MCU reports every physical key press as props button_pressed "<key>".
  # A long press cannot be told apart from a short one - the message and the
  # effect are identical - but a double press can.
  #
  # Double press on the oscillation key toggles the wind mode. The two
  # oscillation toggles cancel each other out, so the swing ends up where it
  # was. This runs entirely on the ESP, no Home Assistant and no network
  # required.
  on_button_press:
    - lambda: |-
        if (x != "angle")
          return;

        const uint32_t now = millis();
        const uint32_t previous = id(last_angle_press);
        id(last_angle_press) = now;

        if (previous == 0 || now - previous >= 900)
          return;

        id(last_angle_press) = 0;  // consumed, a third press starts over

        // set_mode carries the current level over by itself
        bool natural = id(fan_hub).get_string("mode") == "natural";
        ESP_LOGI("zhimi_miio", "Double press: %s", natural ? "natural -> normal" : "normal -> natural");
        id(fan_hub).set_mode(natural ? "normal" : "natural");

fan:
  - platform: zhimi_miio
    id: fan_main
    name: "Fan"
    icon: mdi:fan

switch:
  - platform: template
    id: sw_natural
    name: "Natural Wind"
    icon: mdi:weather-windy
    lambda: 'return id(fan_hub).get_string("mode") == "natural";'
    turn_on_action:
      - lambda: 'id(fan_hub).set_mode("natural");'
    turn_off_action:
      - lambda: 'id(fan_hub).set_mode("normal");'

  - platform: template
    name: "Child Lock"
    icon: mdi:lock
    entity_category: config
    lambda: 'return id(fan_hub).get_bool("child_lock");'
    turn_on_action:
      - lambda: 'id(fan_hub).set_string_prop("child_lock", "on");'
    turn_off_action:
      - lambda: 'id(fan_hub).set_string_prop("child_lock", "off");'

  - platform: template
    name: "Notification Sounds"
    icon: mdi:volume-high
    entity_category: config
    lambda: 'return id(fan_hub).get_number("buzzer", 0) > 0;'
    turn_on_action:
      - lambda: 'id(fan_hub).set_number_prop("buzzer", 1);'
    turn_off_action:
      - lambda: 'id(fan_hub).set_number_prop("buzzer", 0);'

number:
  - platform: template
    id: nr_fan_level
    name: "Fan Level"
    icon: mdi:fan-chevron-up
    update_interval: 2s
    min_value: 1
    max_value: 4
    step: 1
    lambda: |-
      int level = id(fan_hub).get_number("fan_level", 0);
      if (level < 1)
        return {};
      return (float) level;
    set_action:
      - lambda: 'id(fan_hub).set_number_prop("fan_level", (int) x);'

  - platform: template
    name: "Off Delay"
    icon: mdi:clock-outline
    entity_category: config
    unit_of_measurement: min
    device_class: duration
    update_interval: 2s
    min_value: 0
    max_value: 480
    step: 1
    # poweroff_time counts down in seconds (verified: 600 -> 499 in 105s)
    lambda: 'return id(fan_hub).get_number("poweroff_time", 0) / 60.0f;'
    set_action:
      - lambda: 'id(fan_hub).set_number_prop("poweroff_time", (int) (x * 60));'

select:
  - platform: template
    name: "Oscillation Angle"
    icon: mdi:angle-obtuse
    update_interval: 2s
    options: ["30", "60", "90", "120"]
    lambda: |-
      if (!id(fan_hub).has_prop("angle"))
        return {};
      return id(fan_hub).get_string("angle");
    set_action:
      - lambda: 'id(fan_hub).set_number_prop("angle", atoi(x.c_str()));'

  - platform: template
    name: "LED Brightness"
    icon: mdi:brightness-6
    entity_category: config
    update_interval: 2s
    options: ["Bright", "Dim", "Off"]
    lambda: |-
      switch (id(fan_hub).get_number("led_b", -1)) {
        case 0: return std::string{"Bright"};
        case 1: return std::string{"Dim"};
        case 2: return std::string{"Off"};
      }
      return {};
    set_action:
      - lambda: |-
          // led_b: 0 = bright, 1 = dim, 2 = off
          int brightness = 0;
          if (x == "Dim")
            brightness = 1;
          else if (x == "Off")
            brightness = 2;
          id(fan_hub).set_number_prop("led_b", brightness);

button:
  # same wind mode toggle as the double press, for hold_action on a dashboard
  - platform: template
    id: btn_toggle_mode
    name: "Toggle Wind Mode"
    icon: mdi:weather-windy
    on_press:
      - lambda: |-
          bool natural = id(fan_hub).get_string("mode") == "natural";
          id(fan_hub).set_mode(natural ? "normal" : "natural");

  # set_move only works while oscillation is off, otherwise the MCU
  # answers with -6007 device_busy
  - platform: template
    name: "Turn Left"
    icon: mdi:pan-left
    on_press:
      - lambda: 'id(fan_hub).set_string_prop("move", "left");'

  - platform: template
    name: "Turn Right"
    icon: mdi:pan-right
    on_press:
      - lambda: 'id(fan_hub).set_string_prop("move", "right");'

  - platform: template
    name: "Refresh from MCU"
    icon: mdi:refresh
    entity_category: diagnostic
    on_press:
      - lambda: 'id(fan_hub).request_refresh();'

sensor:
  - platform: template
    name: "Fan Speed"
    icon: mdi:fan
    unit_of_measurement: rpm
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (!id(fan_hub).has_prop("speed"))
        return {};
      return id(fan_hub).get_number("speed", 0);

  - platform: template
    name: "Use Time"
    icon: mdi:timer-outline
    unit_of_measurement: h
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      if (!id(fan_hub).has_prop("use_time"))
        return {};
      return id(fan_hub).get_number("use_time", 0) / 3600.0f;

text_sensor:
  - platform: template
    name: "MCU Properties"
    icon: mdi:code-braces
    entity_category: diagnostic
    update_interval: 2s
    lambda: 'return id(fan_hub).props_summary();'

  - platform: template
    name: "MCU Version"
    icon: mdi:chip
    entity_category: diagnostic
    update_interval: 60s
    lambda: 'return id(fan_hub).get_mcu_version();'
